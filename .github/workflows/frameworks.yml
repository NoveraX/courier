name: Frameworks

# The user's session in an application built with each framework version
# Courier supports, as e2e/frameworks/targets.json lists them: each version
# is installed from npm beside Courier's packages, packed as the registry
# would ship them, then built, served and driven in Chromium, WebKit and
# Firefox against an API that records every request it receives. A failure
# keeps its trace and screenshots.
on:
  # Every push and pull request, called from CI
  workflow_call:
    inputs:
      targets:
        description: Framework versions to check, by id; all when empty
        type: string
        default: ""
  # Some versions by hand, by id, separated by spaces; all when left empty
  workflow_dispatch:
    inputs:
      targets:
        description: Framework versions to check, by id; all when empty
        type: string
        default: ""
  # Each version is a range that resolves to its newest release, so a new
  # release of a framework is checked within the week, whatever changes here
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ids: ${{ steps.list.outputs.ids }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: List the versions to check
        id: list
        env:
          TARGETS: ${{ inputs.targets }}
        # Split on purpose: one id per word
        run: echo "ids=$(node scripts/test-frameworks.mjs --list $TARGETS)" >> "$GITHUB_OUTPUT"

      - name: Name the browsers' image
        id: image
        run: |
          image=$(node scripts/playwright-image.mjs)
          echo "image=$image" >> "$GITHUB_OUTPUT"

  session:
    needs: targets
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # In Playwright's own image of the release the lockfile pins: the three
    # engines come with every library, font and display server they load, so
    # no job waits on the system's package mirror, which at times sent them
    # slower than the job may run. As the runner's user, who owns the
    # workspace and HOME as Firefox requires, with the host's shared memory
    # for Chromium and an init process that reaps what the servers leave.
    # Its clock reads UTC, as the runner's does, whatever the image is set to.
    #
    # Node takes a name's IPv4 address first, as on the runner, whose hosts
    # file gives localhost 127.0.0.1 alone. The container's gives it ::1 too:
    # a server listening on localhost would take ::1, while Node's own
    # requests, on a machine with no IPv6 network, look for it on 127.0.0.1.
    container:
      image: ${{ needs.targets.outputs.image }}
      options: --user 1001 --ipc=host --init
      env:
        TZ: UTC
        NODE_OPTIONS: --dns-result-order=ipv4first
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The versions install the packages packed from their builds
      - name: Build packages
        run: npm run build

      - name: The session in ${{ matrix.target }}
        env:
          # Not TARGET: vinxi reads that one as SolidStart's Nitro preset
          FRAMEWORK_TARGET: ${{ matrix.target }}
        run: npm run test:frameworks -- "$FRAMEWORK_TARGET"

      - name: Keep what a failure left
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frameworks-${{ matrix.target }}
          path: node_modules/.cache/courier-frameworks/${{ matrix.target }}/
          retention-days: 7
