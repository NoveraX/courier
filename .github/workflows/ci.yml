name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Every check again, by hand
  workflow_dispatch:

# A pull request's newer push supersedes its run. A run of master is never
# cut short this way: its last job is the release, which must not stop half
# way through publishing; the superseded job cancels the older runs instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Every job reads the repository and nothing more; the release job and the
# superseded job ask for what they need on their own.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    # The Redis adapters are tested against a real Redis: a mock of the
    # client cannot show what Redis itself does with a Lua script or a
    # command's flags. Those tests are skipped when no Redis answers.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Build first: lint, typecheck and test all resolve workspace packages
      # through their published entry points, which only exist after a build.
      - name: Build
        run: npm run build

      - name: Lint (Biome)
        run: npx biome check .

      # Biome notes a field it has deprecated only as a note, and a schema
      # left behind only in an editor; this fails on either.
      - name: Check Biome's configuration
        run: npm run check:biome

      - name: Check file and directory names
        run: npm run check:names

      # npx runs a package from npm under a command's bare name wherever the
      # project has no copy, and npm keeps other people's packages under
      # Courier's bare command names: every command we tell people to run
      # names its package in full.
      - name: Check commands name their package
        run: npm run check:npx

      # 150 lines of code a file; comments, blank lines and files of types alone are free.
      - name: Check file length
        run: npm run check:lines

      - name: Typecheck
        run: npx tsc --noEmit

      # The root program's include stops at packages/*/src, so the Studio UI —
      # one directory deeper — needs its own pass.
      - name: Typecheck Studio UI
        run: npx turbo run typecheck --filter=@noverax/courier-studio-ui

      # Biome refuses an any written in the source; this finds the ones
      # declarations hand it — JSON.parse, Reflect.get, a rejection reason —
      # used unchecked.
      - name: Check for values typed any
        run: npm run check:any

      # The site's own suite runs with the rest, from the site's own lockfile.
      - name: Install the site's dependencies
        run: npm ci
        working-directory: docs

      - name: Test
        if: matrix.node-version != 24
        run: npm test

      # The same suite, measured: coverage below the thresholds in
      # vitest.config.ts fails the job.
      - name: Test with coverage
        if: matrix.node-version == 24
        run: npm run test:coverage

      # The only gate that reads the declarations the packages publish; every
      # other one resolves sibling packages through their sources.
      - name: Check published entry points
        run: npm run check:exports

      # What a page takes from Courier, built as an app's bundler builds it:
      # no built-in module of Node, what loads at start within its budget, and
      # no browser API newer than the requirements name unless checked for.
      - name: Check what a page takes
        run: npm run check:browser

      # Each routes module the repository keeps, as Studio writes it from its
      # project's .expose() marks: a mark changed without the module fails.
      - name: Check routes modules
        run: npm run check:routes

      # Every TypeScript sample of the docs and the READMEs, compiled against
      # the built packages, so a sample cannot drift from the API it shows.
      - name: Check documentation samples
        run: npm run check:docs

      # What `npm pack` would publish, read the way it reads the `files` list:
      # every file a manifest points at, and nothing that must stay here.
      - name: Check package contents
        run: npm run check:packages

      # Each manifest linted against what it ships (publint), and each export's
      # JavaScript and types resolved as Node and bundlers resolve them (attw).
      - name: Lint packages as published
        run: npm run check:publish

      # The example a newcomer runs first, run the way its README says: a
      # backend, the proxy in front of it, a page's caller and server code.
      - name: Run the example
        run: npm run demo --workspace examples/basic

  # The suite on the other systems Courier runs on: file paths, renames and
  # sockets behave differently on Windows. These runners have no service
  # containers, so the Redis tests skip here; the Linux job runs them.
  platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      # The Windows runner keeps its temporary directory on the system drive,
      # a network disk whose writes stall for seconds once the suite has used
      # up its allowance, and every test that writes a file stalls with them.
      # The runner's own drive is a local one that keeps up.
      - name: Keep temporary files on the runner's drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install the site's dependencies
        run: npm ci
        working-directory: docs

      - name: Test
        run: npm test

      - name: Run the example
        run: npm run demo --workspace examples/basic

  # The Expo example installs the packages packed, as the registry would ship
  # them, and is typechecked and bundled for iOS and Android: Metro resolves
  # every entry the app imports and Hermes compiles the result, so a package
  # a React Native app cannot load fails here rather than in someone's app.
  react-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build packages
        run: npm run build

      - name: Install the example
        run: npm ci
        working-directory: examples/expo

      - name: Typecheck the example
        run: npm run typecheck
        working-directory: examples/expo

      - name: Bundle the example for iOS and Android
        run: npm run bundle
        working-directory: examples/expo

  # Studio's flows in a real browser: each test file starts Studio from its
  # command line over its own copy of a fixture project, and drives the pages
  # as a developer does. A failure keeps its trace and screenshots.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build packages
        run: npm run build

      # Chrome's, Safari's and Firefox's engines, as developers open Studio in them
      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Studio in a browser
        run: npm run test:e2e

      - name: Keep what a failure left
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: studio-e2e
          path: node_modules/.cache/courier-e2e/
          retention-days: 7

  # The VS Code extension inside VS Code itself, at both ends of what it
  # supports: the oldest version its engines field takes, and the latest
  # stable. Each is downloaded for the run, with a virtual display for its
  # window; the suite reads the hints the editor shows over a call.
  editor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [minimum, stable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build packages
        run: npm run build

      - name: The extension in VS Code (${{ matrix.vscode }})
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:editor -w courier-vscode

  # The user's session in an application built with each framework version
  # Courier supports, from Next.js 14 to a React single-page application:
  # see frameworks.yml, which also runs weekly and by hand.
  frameworks:
    uses: ./.github/workflows/frameworks.yml

  # The one-command setup, npx @noverax/create-courier, creating a
  # project with each framework's own generator: see quickstart.yml, which
  # also runs weekly and by hand.
  quickstart:
    uses: ./.github/workflows/quickstart.yml

  # The commit-msg hook runs only where it is installed and can be skipped, so
  # the same rules run here. A pull request is checked from its merge base; a
  # push, from the last release tag, so a cancelled or skipped run leaves
  # nothing unchecked. The tags come with the full-depth checkout. A release,
  # as for every job, waits for this one to pass.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint commit messages
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/lint-commits.sh "$HEAD_SHA" "$PR_BASE"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The site installs the workspace packages by path, so it resolves them
      # through their built entry points.
      - name: Build packages
        run: npm run build

      - name: Install site
        run: npm ci
        working-directory: docs

      - name: Lint and typecheck site
        run: npm run check
        working-directory: docs

      - name: Build site
        run: npm run build
        working-directory: docs

  # A newer commit on master leaves an older run nothing to release, since a
  # release is cut from master's newest commit: each run of master cancels the
  # older ones still checking or waiting for their release to be approved. One
  # whose release has started is left to finish.
  superseded:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel the older runs of master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          older=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=master&per_page=100" \
            --jq ".workflow_runs[] | select(.id < $RUN_ID and .status != \"completed\" and .event != \"pull_request\") | .id")
          for id in $older; do
            release=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "release") | .status][0] // "not started"')
            case "$release" in
              in_progress | completed) echo "Left https://github.com/$REPO/actions/runs/$id to finish its release" ;;
              *) gh api -X POST "repos/$REPO/actions/runs/$id/cancel" --silent && echo "Cancelled https://github.com/$REPO/actions/runs/$id" ;;
            esac
          done

  # The release, cut by hand: once every other job of a run of master has
  # passed, it waits for approval in the `release` environment, which holds
  # the npm and Open VSX tokens and the Marketplace identity — Review
  # deployments on the run's page, then Approve and deploy. A job that failed
  # leaves it skipped, with nothing to approve, until a re-run of what failed
  # passes.
  release:
    needs: [ci, platforms, react-native, browser, editor, frameworks, quickstart, commits, docs, superseded]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    # One release at a time; a second approved meanwhile waits for it
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm mints the provenance attestation from this token, and the
      # Marketplace identity signs in to Microsoft Entra ID with it
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release is cut from master's newest commit only: an older run
      # approved before a newer one could cancel it stops here.
      - name: Check that this is master's newest commit
        run: |
          newest=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$newest" != "$GITHUB_SHA" ]; then
            echo "::error::master has moved on to ${newest:0:8}: release from the CI run of that commit."
            exit 1
          fi

      # npm 11, which Node 24 bundles, can publish with trusted publishing
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The version released is the tag the run adds; none when the commits
      # since the last release call for none.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: "0"
        run: |
          before=$(git tag --list 'v*' | sort)
          npx semantic-release
          after=$(git tag --list 'v*' | sort)
          released=$(comm -13 <(echo "$before") <(echo "$after") | head -n 1)
          echo "version=${released#v}" >> "$GITHUB_OUTPUT"

      # The editor extensions, at the version the release gave them, on the
      # Visual Studio Marketplace and Open VSX — each the release has a way
      # in to; the Extensions workflow publishes a released version by hand
      # once the other is set up. A prerelease has no version they take.
      - name: Sign in to Microsoft Entra ID as the Marketplace publisher
        if: steps.release.outputs.version != '' && !contains(steps.release.outputs.version, '-') && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The identity is a publisher member, not a role in any subscription
          allow-no-subscriptions: true

      - name: Publish the editor extensions
        if: steps.release.outputs.version != '' && !contains(steps.release.outputs.version, '-')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          MARKETPLACE_SIGNED_IN: ${{ vars.AZURE_CLIENT_ID != '' }}
        run: npx tsx scripts/publish-extensions.ts

      # The packages as released, for a marketplace the run had no way in to:
      # uploaded by hand on its publisher page, Courier File Icons first.
      - name: Keep the editor extensions
        if: always() && steps.release.outputs.version != '' && !contains(steps.release.outputs.version, '-')
        uses: actions/upload-artifact@v7
        with:
          name: editor-extensions
          path: packages/*/dist/*.vsix
          if-no-files-found: ignore
          retention-days: 90
