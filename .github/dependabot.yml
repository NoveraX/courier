# Updates arrive grouped, once a week, as conventional commits the release
# reads: a runtime dependency as a fix, a dev dependency or an action as a
# chore. The site is no part of a release, so its updates come as chores.
# The Expo example follows its SDK, which `npx expo install --fix` keeps it
# in step with, so it is left out.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # semantic-release's plugins write notes with conventional-changelog-writer 8,
      # which the preset refuses from version 10 on; the release tests say when it may move.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      site:
        update-types: [minor, patch]
