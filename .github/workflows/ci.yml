name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    # The Redis adapters are tested against a real Redis: a mock of the
    # client cannot show what Redis itself does with a Lua script or a
    # command's flags. Those tests are skipped when no Redis answers.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Build first: lint, typecheck and test all resolve workspace packages
      # through their published entry points, which only exist after a build.
      - name: Build
        run: npm run build

      - name: Lint (Biome)
        run: npx biome check packages/

      - name: Typecheck
        run: npx tsc --noEmit

      # The root program's include stops at packages/*/src, so the Studio UI —
      # one directory deeper — needs its own pass.
      - name: Typecheck Studio UI
        run: npx turbo run typecheck --filter=@noverax/courier-studio-ui

      - name: Test
        run: npm test

      # The only gate that reads the declarations the packages publish; every
      # other one resolves sibling packages through their sources.
      - name: Check published entry points
        run: npm run check:exports

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The site installs the workspace packages by path, so it resolves them
      # through their built entry points.
      - name: Build packages
        run: npm run build

      - name: Install site
        run: npm ci
        working-directory: docs

      - name: Lint and typecheck site
        run: npm run check
        working-directory: docs

      - name: Build site
        run: npm run build
        working-directory: docs

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm mints the provenance attestation from this token
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: "0"
        run: npx semantic-release
