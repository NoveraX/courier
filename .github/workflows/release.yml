name: Release

# Cut by hand from master (Actions → Release → Run workflow) once CI has
# passed on its last commit: the checks are not run again. The `release`
# environment holds the npm and Open VSX tokens and the Marketplace identity,
# and asks for its reviewers' approval before anything is published.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The commit released is one whose CI run passed: every job of it green.
  # Any other stops here, saying why, before approval is asked for.
  checked:
    name: CI passed on this commit
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Find a CI run of this commit that passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          newest=""
          for id in $(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" --jq '.workflow_runs[].id'); do
            verdict=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq '
              .jobs
              | if length == 0 then "none"
                elif any(.[]; .status != "completed") then "running"
                elif all(.[]; .conclusion == "success" or .conclusion == "skipped") then "passed"
                else "failed" end')
            url="https://github.com/$REPO/actions/runs/$id"
            if [ "$verdict" = passed ]; then
              echo "CI passed on $SHA: $url"
              exit 0
            fi
            if [ -z "$newest" ] && [ "$verdict" != none ]; then newest="$verdict $url"; fi
          done
          case "${newest%% *}" in
            running) echo "::error::CI is still running on $SHA (${newest##* }). Release once it passes." ;;
            failed) echo "::error::CI did not pass on $SHA (${newest##* }). Re-run what failed, then release." ;;
            *) echo "::error::CI has not run on $SHA. Run CI on master, and release once it passes." ;;
          esac
          exit 1

  release:
    needs: checked
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm mints the provenance attestation from this token, and the
      # Marketplace identity signs in to Microsoft Entra ID with it
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # npm 11, which Node 24 bundles, can publish with trusted publishing
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The version released is the tag the run adds; none when the commits
      # since the last release call for none.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: "0"
        run: |
          before=$(git tag --list 'v*' | sort)
          npx semantic-release
          after=$(git tag --list 'v*' | sort)
          released=$(comm -13 <(echo "$before") <(echo "$after") | head -n 1)
          echo "version=${released#v}" >> "$GITHUB_OUTPUT"

      # The editor extensions, at the version the release gave them, on the
      # Visual Studio Marketplace and Open VSX — each the release has a way
      # in to; the Extensions workflow publishes a released version by hand
      # once the other is set up. A prerelease has no version they take.
      - name: Sign in to Microsoft Entra ID as the Marketplace publisher
        if: steps.release.outputs.version != '' && !contains(steps.release.outputs.version, '-') && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # The identity is a publisher member, not a role in any subscription
          allow-no-subscriptions: true

      - name: Publish the editor extensions
        if: steps.release.outputs.version != '' && !contains(steps.release.outputs.version, '-')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          MARKETPLACE_SIGNED_IN: ${{ vars.AZURE_CLIENT_ID != '' }}
        run: npx tsx scripts/publish-extensions.ts

      # The packages as released, for a marketplace the run had no way in to:
      # uploaded by hand on its publisher page, Courier File Icons first.
      - name: Keep the editor extensions
        if: always() && steps.release.outputs.version != '' && !contains(steps.release.outputs.version, '-')
        uses: actions/upload-artifact@v7
        with:
          name: editor-extensions
          path: packages/*/dist/*.vsix
          if-no-files-found: ignore
          retention-days: 90
