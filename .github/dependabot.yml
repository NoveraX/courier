# Updates arrive grouped, once a week, as commits in the repository's own
# convention, so their titles pass the checks and the release reads them: a
# runtime dependency as a fix, a dev dependency or an action as a chore. The
# site is no part of a release, so its updates come as chores. The Expo
# example follows its SDK, which `npx expo install --fix` keeps it in step
# with, so it is left out.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps): 🐛 "
      prefix-development: "chore(deps): 🔧 "
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 ships no compiler API, which the docs site's build and
      # the repository's checks load.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # semantic-release's plugins write notes with conventional-changelog-writer 8,
      # which the preset refuses from version 10 on; the release tests say when it may move.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps): 👷 "

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps): 🔧 "
    groups:
      site:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 ships no compiler API, which Next.js type-checks the site with.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
