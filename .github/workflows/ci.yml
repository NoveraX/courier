name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push supersedes a pull request's run; on master it waits, so a
# release job already publishing is never cancelled half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    # The Redis adapters are tested against a real Redis: a mock of the
    # client cannot show what Redis itself does with a Lua script or a
    # command's flags. Those tests are skipped when no Redis answers.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Build first: lint, typecheck and test all resolve workspace packages
      # through their published entry points, which only exist after a build.
      - name: Build
        run: npm run build

      - name: Lint (Biome)
        run: npx biome check .

      - name: Check file and directory names
        run: npm run check:names

      - name: Typecheck
        run: npx tsc --noEmit

      # The root program's include stops at packages/*/src, so the Studio UI —
      # one directory deeper — needs its own pass.
      - name: Typecheck Studio UI
        run: npx turbo run typecheck --filter=@noverax/courier-studio-ui

      # Biome refuses an any written in the source; this finds the ones
      # declarations hand it — JSON.parse, Reflect.get, a rejection reason —
      # used unchecked.
      - name: Check for values typed any
        run: npm run check:any

      - name: Test
        if: matrix.node-version != 24
        run: npm test

      # The same suite, measured: coverage below the thresholds in
      # vitest.config.ts fails the job.
      - name: Test with coverage
        if: matrix.node-version == 24
        run: npm run test:coverage

      # The only gate that reads the declarations the packages publish; every
      # other one resolves sibling packages through their sources.
      - name: Check published entry points
        run: npm run check:exports

      # Every TypeScript sample of the docs and the READMEs, compiled against
      # the built packages, so a sample cannot drift from the API it shows.
      - name: Check documentation samples
        run: npm run check:docs

      # What `npm pack` would publish, read the way it reads the `files` list:
      # every file a manifest points at, and nothing that must stay here.
      - name: Check package contents
        run: npm run check:packages

      # Each manifest linted against what it ships (publint), and each export's
      # JavaScript and types resolved as Node and bundlers resolve them (attw).
      - name: Lint packages as published
        run: npm run check:publish

      # The example a newcomer runs first, run the way its README says: a
      # backend, the proxy in front of it, a page's caller and server code.
      - name: Run the example
        run: npm run demo --workspace examples/basic

  # The suite on the other systems Courier runs on: file paths, renames and
  # sockets behave differently on Windows. These runners have no service
  # containers, so the Redis tests skip here; the Linux job runs them.
  platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Run the example
        run: npm run demo --workspace examples/basic

  # The commit-msg hook runs only where it is installed and can be skipped, so
  # the same rules run here. A pull request is checked from its merge base; a
  # push, from the last release tag, so a cancelled or skipped run leaves
  # nothing unchecked. The tags come with the full-depth checkout. The release
  # does not wait for this job: a commit already on master cannot be reworded
  # without rewriting master, so a failure reports it rather than holding
  # every later release back.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint commit messages
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/lint-commits.sh "$HEAD_SHA" "$PR_BASE"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The site installs the workspace packages by path, so it resolves them
      # through their built entry points.
      - name: Build packages
        run: npm run build

      - name: Install site
        run: npm ci
        working-directory: docs

      - name: Lint and typecheck site
        run: npm run check
        working-directory: docs

      - name: Build site
        run: npm run build
        working-directory: docs

  release:
    needs: [ci, platforms]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm mints the provenance attestation from this token
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # npm 11, which Node 24 bundles, can publish with trusted publishing
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: "0"
        run: npx semantic-release
